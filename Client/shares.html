<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelCo — Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
        .shares-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: var(--space-3);
            margin: 0 auto var(--space-6);
            max-width: 760px;
        }

            .shares-toolbar .field {
                flex: 1;
                min-width: 200px;
            }

            .shares-toolbar .select,
            .shares-toolbar .btn {
                height: 46px;
                white-space: nowrap;
            }

        .feed {
            display: grid;
            gap: var(--space-5);
            grid-template-columns: 1fr;
            max-width: 760px;
            margin-inline: auto;
        }

        .share-card .card__title {
            font-size: var(--fs-lg);
        }
    </style>
</head>
<body>
    <div id="nav-root"></div>
    <main class="container section">
        <h1 class="section-title">Community</h1>
        <div class="shares-toolbar">
            <div class="field">
                <label class="label" for="countryFilter">Filter by country</label>
                <select class="select" id="countryFilter"></select>
            </div>
            <button class="btn btn--primary hidden" id="newShareBtn" type="button">+ Share a trip</button>
        </div>
        <div class="feed" id="feed"></div>
    </main>
    <div id="footer-root"></div>
    <script type="module" src="js/pages/shares.js"></script>
</body>
</html>
