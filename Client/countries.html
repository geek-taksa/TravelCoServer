<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelCo — Countries</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: var(--space-3);
            margin-bottom: var(--space-5);
        }

            .toolbar .input-group {
                flex: 1;
                min-width: 240px;
            }

                .toolbar .input-group .input {
                    min-width: 0;
                }

        .sort-group {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .filter-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: var(--space-4);
            padding: var(--space-5);
            margin-bottom: var(--space-5);
        }

        .result-count {
            color: var(--color-muted);
            font-size: var(--fs-sm);
            margin-bottom: var(--space-4);
        }

        .country-card {
            display: block;
        }

        .country-card__flag {
            height: 140px;
            background-size: cover;
            background-position: center;
            background-color: var(--color-border);
        }

        .country-card .badge {
            margin-bottom: var(--space-2);
        }

        .pager {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-2);
            justify-content: center;
            margin-top: var(--space-6);
        }

            .pager .btn {
                min-width: 42px;
                padding: var(--space-2) var(--space-3);
            }
    </style>
</head>
<body>
    <div id="nav-root"></div>
    <main class="container section">
        <h1 class="section-title">Explore countries</h1>

        <div class="toolbar">
            <div class="input-group">
                <input class="input" id="searchInput" type="search" placeholder="Search for a country" aria-label="Search for a country" />
                <button class="icon-btn icon-btn--primary" type="button" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                </button>
            </div>
            <button class="icon-btn" id="filterBtn" type="button" aria-label="Toggle filters" title="Filters">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" /></svg>
            </button>
            <div class="sort-group">
                <label class="label" for="sortField">Sort</label>
                <select class="select" id="sortField">
                    <option value="name">Name</option>
                    <option value="population">Population</option>
                    <option value="area">Area</option>
                    <option value="region">Region</option>
                </select>
                <button class="btn btn--outline" id="sortOrder" type="button" title="Toggle order"><span>Ascending</span></button>
            </div>
        </div>

        <div class="card filter-panel hidden" id="filterPanel">
            <div class="field"><label class="label" for="filterRegion">Region</label><select class="select" id="filterRegion"></select></div>
            <div class="field"><label class="label" for="filterLanguage">Language</label><select class="select" id="filterLanguage"></select></div>
            <div class="field"><label class="label" for="filterCurrency">Currency</label><select class="select" id="filterCurrency"></select></div>
        </div>

        <p class="result-count" id="resultCount"></p>
        <div id="results"></div>
        <div class="pager" id="pager"></div>
    </main>
    <div id="footer-root"></div>
    <script type="module" src="js/pages/countries.js"></script>
</body>
</html>
