<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelCo — Create your account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <style>
        .auth-wrap {
            max-width: 560px;
            margin: var(--space-8) auto;
        }

        .auth-card {
            padding: var(--space-7);
        }

        .auth-title {
            font-family: var(--font-display);
            font-size: var(--fs-2xl);
            color: var(--color-heading);
            margin-bottom: var(--space-2);
        }

        .auth-sub {
            color: var(--color-muted);
            margin-bottom: var(--space-6);
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-2);
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: var(--space-2);
            font-size: var(--fs-sm);
        }

        .lang-row {
            gap: var(--space-2);
        }

            .lang-row .input {
                flex: 1;
            }

            .lang-row .select {
                width: 150px;
            }

            .lang-row .icon-btn {
                flex-shrink: 0;
            }

        .form-foot {
            margin-top: var(--space-5);
            text-align: center;
            color: var(--color-muted);
            font-size: var(--fs-sm);
        }

            .form-foot a {
                color: var(--color-primary);
                font-weight: var(--fw-medium);
            }

        fieldset {
            border: none;
        }

        legend {
            font-weight: var(--fw-medium);
            color: var(--color-heading);
            margin-bottom: var(--space-2);
            font-size: var(--fs-sm);
        }
    </style>
</head>
<body>
    <div id="nav-root"></div>
    <main class="container">
        <div class="auth-wrap">
            <div class="card auth-card">
                <h1 class="auth-title">Create your account</h1>
                <p class="auth-sub">Join TravelCo to save countries, share trips and play quizzes.</p>
                <form id="registerForm" class="stack" novalidate>
                    <div class="field">
                        <label class="label" for="username">Name</label>
                        <input class="input" id="username" name="username" type="text" placeholder="Your name" autocomplete="name" />
                        <span class="field__error" id="errUsername"></span>
                    </div>
                    <div class="field">
                        <label class="label" for="email">Email</label>
                        <input class="input" id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" />
                        <span class="field__error" id="errEmail"></span>
                    </div>
                    <div class="field">
                        <label class="label" for="password">Password</label>
                        <input class="input" id="password" name="password" type="password" placeholder="At least 6 characters" autocomplete="new-password" />
                        <span class="field__error" id="errPassword"></span>
                    </div>
                    <div class="field">
                        <label class="label" for="confirm">Confirm password</label>
                        <input class="input" id="confirm" name="confirm" type="password" placeholder="Repeat your password" autocomplete="new-password" />
                        <span class="field__error" id="errConfirm"></span>
                    </div>
                    <fieldset>
                        <legend>Continents you're interested in</legend>
                        <div class="checkbox-grid" id="continents"></div>
                    </fieldset>
                    <fieldset>
                        <legend>Languages you speak</legend>
                        <div class="stack" id="languages"></div>
                        <button type="button" class="btn btn--outline" id="addLang" style="margin-top: var(--space-3)">+ Add language</button>
                    </fieldset>
                    <button type="submit" class="btn btn--primary btn--block">Create account</button>
                </form>
                <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </main>
    <div id="footer-root"></div>
    <script type="module" src="js/pages/register.js"></script>
</body>
</html>
