<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TravelCo — Explore the countries of the world</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <style>
        .hero {
            height: clamp(280px, 42vw, 560px);
            background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.05)), url("https://images.unsplash.com/photo-1526772662000-3f88f10405ff?auto=format&fit=crop&w=1600&q=70") center/cover no-repeat;
        }

        .home-search {
            max-width: 560px;
            margin: var(--space-8) auto var(--space-6);
        }

            .home-search .row {
                justify-content: center;
                gap: var(--space-2);
            }
    </style>
</head>
<body>
    <div id="nav-root"></div>

    <main>
        <section class="hero" aria-label="World map banner"></section>

        <div class="container">
            <div class="home-search">
                <form class="row" id="searchForm" role="search">
                    <div class="input-group">
                        <input class="input" id="searchInput" type="search" placeholder="Search for a country" aria-label="Search for a country" />
                        <button class="icon-btn icon-btn--primary" type="submit" aria-label="Search">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
                        </button>
                    </div>
                    <button class="icon-btn" id="filterBtn" type="button" aria-label="Filter">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z" /></svg>
                    </button>
                    <button class="icon-btn" id="sortBtn" type="button" aria-label="Sort">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 16 4 4 4-4" /><path d="M7 20V4" /><path d="m21 8-4-4-4 4" /><path d="M17 4v16" /></svg>
                    </button>
                </form>
            </div>

            <section class="section">
                <h2 class="section-title">Countries by Region</h2>
                <div class="region-list" id="regionList">
                    <div class="loading-state"><div class="spinner"></div>Loading regions…</div>
                </div>
            </section>
        </div>
    </main>

    <div id="footer-root"></div>

    <script type="module" src="js/pages/home.js"></script>
</body>
</html>
